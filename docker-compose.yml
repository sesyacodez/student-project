version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=edumanage_db
      - POSTGRES_USER=edu_user
      - POSTGRES_PASSWORD=edu_super_secret
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U edu_user -d edumanage_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_DB=edumanage_db
      - POSTGRES_USER=edu_user
      - POSTGRES_PASSWORD=edu_super_secret
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: