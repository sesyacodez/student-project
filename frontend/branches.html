<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Branches — EduManage</title>
    <link rel="stylesheet" href="styles/global.css" />
  </head>
  <body>
    <div class="app-container">
      <header data-nav></header>
      <main>
        <h1>Branches</h1>
        <p class="muted">Create branch locations and keep their status up to date.</p>
        <div id="banner"></div>

        <div class="app-card">
          <div class="app-card__header"><h2>Filters</h2></div>
          <div class="app-card__body app-form app-form--wide">
            <div class="app-form__row app-form__row--inline">
              <label class="app-form__label">
                City
                <input class="app-form__input" id="filter-branch-city" type="text" placeholder="City" />
              </label>
              <label class="app-form__label">
                Status
                <select class="app-form__select" id="filter-branch-status">
                  <option value="">Any</option>
                  <option value="active">Active</option>
                  <option value="archived">Archived</option>
                </select>
              </label>
            </div>
            <div class="app-form__row app-form__row--inline">
              <label class="app-form__label" for="filter-branch-search">Search</label>
              <input class="app-form__input" id="filter-branch-search" type="search" placeholder="Branch name or address" />
              <button type="button" class="app-btn app-btn--primary" id="btn-reload-branches">Apply</button>
            </div>
          </div>
        </div>

        <div class="app-card">
          <div class="app-card__header"><h2 id="branch-form-title">Create branch</h2></div>
          <div class="app-card__body">
            <form id="branch-form" class="app-form app-form--wide">
              <input id="branch-id" type="hidden" />
              <div class="app-form__row app-form__row--inline">
                <label class="app-form__label">
                  Name
                  <input class="app-form__input" id="branch-name" required />
                </label>
                <label class="app-form__label">
                  City
                  <input class="app-form__input" id="branch-city" required />
                </label>
                <label class="app-form__label">
                  Status
                  <select class="app-form__select" id="branch-status">
                    <option value="active">Active</option>
                    <option value="archived">Archived</option>
                  </select>
                </label>
              </div>
              <div class="app-form__row">
                <label class="app-form__label">
                  Address
                  <input class="app-form__input" id="branch-address" required />
                </label>
              </div>
              <div class="app-form__row app-form__row--inline">
                <button type="submit" class="app-btn app-btn--primary" id="branch-save">Create branch</button>
                <button type="button" class="app-btn app-btn--ghost" id="branch-reset">Reset</button>
              </div>
            </form>
          </div>
        </div>

        <div class="app-card">
          <div class="app-card__header"><h2>Branches list</h2></div>
          <div class="app-card__body app-table-wrap">
            <table class="app-table" id="branches-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>City</th>
                  <th>Address</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="js/pages/branches.js"></script>
  </body>
</html>
