<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — EduManage</title>
    <link rel="stylesheet" href="styles/global.css" />
  </head>
  <body>
    <div class="app-container">
      <header data-nav></header>
      <main>
        <h1>Sign in</h1>
        <p class="muted">Sign in with your phone number and password.</p>
        <div id="banner"></div>
        <form id="login-form" class="app-card">
          <div class="app-card__body app-form">
            <div class="app-form__row">
              <label class="app-form__label" for="phone">Phone</label>
              <input class="app-form__input" id="phone" name="phone" type="text" required />
            </div>
            <div class="app-form__row">
              <label class="app-form__label" for="password">Password</label>
              <input class="app-form__input" id="password" name="password" type="password" required />
            </div>
            <button type="submit" class="app-btn app-btn--primary">Sign in</button>
          </div>
        </form>
      </main>
    </div>
    <script type="module" src="js/pages/login.js"></script>
  </body>
</html>
