<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lessons — EduManage</title>
    <link rel="stylesheet" href="styles/global.css" />
  </head>
  <body>
    <div class="app-container">
      <header data-nav></header>
      <main>
        <h1>Lessons</h1>
        <div id="banner"></div>

        <div class="app-card">
          <div class="app-card__header"><h2>Filters</h2></div>
          <div class="app-card__body app-form app-form--wide">
            <div class="app-form__row app-form__row--inline">
              <label class="app-form__label">Branch
                <select class="app-form__select" id="filter-branch">
                  <option value="">Any branch</option>
                </select>
              </label>
              <label class="app-form__label">Teacher
                <select class="app-form__select" id="filter-teacher">
                  <option value="">Any teacher</option>
                </select>
              </label>
              <label class="app-form__label">Status
                <select class="app-form__select" id="filter-status">
                  <option value="">any</option>
                  <option value="scheduled">scheduled</option>
                  <option value="completed">completed</option>
                  <option value="cancelled">cancelled</option>
                </select>
              </label>
            </div>
            <div class="app-form__row app-form__row--inline">
              <label class="app-form__label">date_from <input class="app-form__input" id="filter-from" type="date" /></label>
              <label class="app-form__label">date_to <input class="app-form__input" id="filter-to" type="date" /></label>
              <button type="button" class="app-btn app-btn--primary" id="btn-reload">Apply</button>
            </div>
          </div>
        </div>

        <div class="app-card">
          <div class="app-card__header"><h2>Create lesson</h2></div>
          <div class="app-card__body">
            <form id="lesson-form" class="app-form app-form--wide" onsubmit="return false">
              <div class="app-form__row app-form__row--inline">
                <label><input type="radio" name="lesson_kind" value="individual" checked /> Individual</label>
                <label><input type="radio" name="lesson_kind" value="group" /> Group</label>
              </div>
              <div class="app-form__row">
                <label class="app-form__label" for="teacher_id">Teacher</label>
                <select class="app-form__select" id="teacher_id" required></select>
              </div>
              <div class="app-form__row">
                <label class="app-form__label" for="subject_id">subject</label>
                <select class="app-form__select" id="subject_id" required></select>
              </div>
              <div class="app-form__row" id="row-student">
                <label class="app-form__label" for="student_id">student</label>
                <select class="app-form__select" id="student_id"></select>
              </div>
              <div class="app-form__row" id="row-group" style="display: none">
                <label class="app-form__label" for="group_id">group</label>
                <select class="app-form__select" id="group_id"></select>
              </div>
              <div class="app-form__row app-form__row--inline">
                <label class="app-form__label">date <input class="app-form__input" id="date" type="date" required /></label>
                <label class="app-form__label">start <input class="app-form__input" id="start_time" type="time" step="1" required /></label>
                <label class="app-form__label">end <input class="app-form__input" id="end_time" type="time" step="1" required /></label>
              </div>
              <div class="app-form__row app-form__row--inline">
                <button type="button" class="app-btn app-btn--ghost" id="btn-check-conflicts">Check conflicts</button>
                <button type="button" class="app-btn app-btn--primary" id="btn-create">Create</button>
              </div>
            </form>
          </div>
        </div>

        <div class="app-card">
          <div class="app-card__header"><h2>List</h2></div>
          <div class="app-card__body app-table-wrap">
            <table class="app-table" id="lesson-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Time</th>
                  <th>Subject</th>
                  <th>Teacher</th>
                  <th>Who</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="js/pages/lessons.js"></script>
  </body>
</html>
