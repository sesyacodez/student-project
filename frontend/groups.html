<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Groups — EduManage</title>
    <link rel="stylesheet" href="styles/global.css" />
  </head>
  <body>
    <div class="app-container">
      <header data-nav></header>
      <main>
        <h1>Groups</h1>
        <p class="muted">Create groups, archive old ones, and manage membership history.</p>
        <div id="banner"></div>

        <div class="app-card">
          <div class="app-card__header"><h2>Filters</h2></div>
          <div class="app-card__body app-form app-form--wide">
            <div class="app-form__row app-form__row--inline">
              <label class="app-form__label">
                Branch
                <select class="app-form__select" id="filter-group-branch"></select>
              </label>
              <label class="app-form__label">
                Status
                <select class="app-form__select" id="filter-group-status">
                  <option value="">Any</option>
                  <option value="active">Active</option>
                  <option value="archived">Archived</option>
                </select>
              </label>
            </div>
            <div class="app-form__row app-form__row--inline">
              <label class="app-form__label" for="filter-group-search">Search</label>
              <input class="app-form__input" id="filter-group-search" type="search" placeholder="Group name" />
              <button type="button" class="app-btn app-btn--primary" id="btn-reload-groups">Apply</button>
            </div>
          </div>
        </div>

        <div class="app-card">
          <div class="app-card__header"><h2 id="group-form-title">Create group</h2></div>
          <div class="app-card__body">
            <form id="group-form" class="app-form app-form--wide">
              <input id="group-id" type="hidden" />
              <div class="app-form__row app-form__row--inline">
                <label class="app-form__label">
                  Name
                  <input class="app-form__input" id="group-name" required />
                </label>
                <label class="app-form__label">
                  Branch
                  <select class="app-form__select" id="group-branch" required></select>
                </label>
                <label class="app-form__label">
                  Status
                  <select class="app-form__select" id="group-status">
                    <option value="active">Active</option>
                    <option value="archived">Archived</option>
                  </select>
                </label>
              </div>
              <div class="app-form__row app-form__row--inline">
                <button type="submit" class="app-btn app-btn--primary" id="group-save">Create group</button>
                <button type="button" class="app-btn app-btn--ghost" id="group-reset">Reset</button>
              </div>
            </form>
          </div>
        </div>

        <div class="app-card">
          <div class="app-card__header"><h2>Groups list</h2></div>
          <div class="app-card__body app-table-wrap">
            <table class="app-table" id="groups-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Branch</th>
                  <th>Status</th>
                  <th>Students</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="app-card">
          <div class="app-card__header"><h2>Memberships</h2></div>
          <div class="app-card__body">
            <div class="app-form app-form--wide">
              <div class="app-form__row app-form__row--inline">
                <label class="app-form__label">
                  Group
                  <select class="app-form__select" id="member-group-id"></select>
                </label>
                <button type="button" class="app-btn app-btn--ghost" id="btn-load-members">Load members</button>
              </div>
              <div class="app-form__row app-form__row--inline">
                <label class="app-form__label">
                  Student
                  <select class="app-form__select" id="member-student-id"></select>
                </label>
                <label class="app-form__label">
                  Join date
                  <input class="app-form__input" id="member-join-date" type="date" />
                </label>
                <button type="button" class="app-btn app-btn--primary" id="btn-add-member">Add member</button>
              </div>
            </div>
            <div class="app-table-wrap" style="margin-top: 1rem;">
              <table class="app-table" id="members-table">
                <thead>
                  <tr>
                    <th>Student</th>
                    <th>Branch</th>
                    <th>Join date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="js/pages/groups.js"></script>
  </body>
</html>
